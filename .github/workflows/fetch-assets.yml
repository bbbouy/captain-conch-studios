name: Fetch logo and conch candidates

on:
  push:
    paths:
      - .github/workflows/fetch-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow requests

      - name: Download logo and candidate photos
        run: |
          mkdir -p _work
          curl -sSL -o _work/logo.png https://captainconchbahamas.com/icons/app-icon-512.png || true
          python - <<'PY'
          import requests, json, io
          from PIL import Image, ImageDraw
          H = {"User-Agent": "CaptainConchStudiosSite/1.0 (github.com/bbbouy)"}
          found = []
          # Wikimedia Commons file search
          for q in ["Lobatus gigas shell", "Strombus gigas shell", "Aliger gigas shell", "queen conch shell"]:
              r = requests.get("https://commons.wikimedia.org/w/api.php", headers=H, params={
                  "action":"query","format":"json","generator":"search","gsrnamespace":6,
                  "gsrsearch":q,"gsrlimit":20,"prop":"imageinfo","iiprop":"url|extmetadata|mime",
                  "iiurlwidth":1200}).json()
              for p in (r.get("query",{}).get("pages",{}) or {}).values():
                  ii = p["imageinfo"][0]
                  if ii.get("mime") not in ("image/jpeg","image/png"): continue
                  em = ii.get("extmetadata",{})
                  lic = em.get("LicenseShortName",{}).get("value","")
                  if not any(k in lic for k in ("CC0","Public domain","CC BY")) or "NC" in lic or "ND" in lic: continue
                  found.append({"src":"commons","title":p["title"],"thumb":ii.get("thumburl"),"page":ii.get("descriptionurl"),
                                "license":lic,"author":em.get("Artist",{}).get("value","")})
          # Openverse
          r = requests.get("https://api.openverse.org/v1/images/", headers=H,
                           params={"q":"queen conch shell","license":"cc0,by,by-sa,pdm","page_size":30}).json()
          for x in r.get("results",[]):
              found.append({"src":"openverse","title":x.get("title"),"thumb":x.get("url"),"page":x.get("foreign_landing_url"),
                            "license":f'{x.get("license")} {x.get("license_version") or ""}',"author":x.get("creator")})
          seen=set(); uniq=[]
          for f in found:
              if f["thumb"] and f["thumb"] not in seen: seen.add(f["thumb"]); uniq.append(f)
          uniq = uniq[:40]
          tiles=[]
          for i,f in enumerate(uniq):
              try:
                  b = requests.get(f["thumb"], headers=H, timeout=30).content
                  im = Image.open(io.BytesIO(b)).convert("RGB")
                  im.save(f"_work/cand_{i:02d}.jpg", quality=90)
                  t = im.copy(); t.thumbnail((240,240))
                  tile = Image.new("RGB",(250,270),"white"); tile.paste(t,(5,5))
                  ImageDraw.Draw(tile).text((8,250),f"#{i}",fill="black")
                  tiles.append(tile); f["file"]=f"cand_{i:02d}.jpg"
              except Exception as e:
                  f["error"]=str(e)
          cols=6; rows=(len(tiles)+cols-1)//cols or 1
          sheet=Image.new("RGB",(cols*250,rows*270),"white")
          for i,t in enumerate(tiles): sheet.paste(t,((i%cols)*250,(i//cols)*270))
          sheet.save("_work/contact-sheet.jpg",quality=80)
          json.dump(uniq,open("_work/candidates.json","w"),indent=1)
          print(len(tiles),"candidates")
          PY
          ls -la _work

      - name: Save into the project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add _work/
          git commit -m "Fetch logo and conch candidates" || echo "nothing new"
          git push
